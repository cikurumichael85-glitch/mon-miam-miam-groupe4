name: Verification integration
on:
  workflow_dispatch:
  pull_request:
    branches: [integration, main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [integration, main]
permissions:
  contents: read
concurrency:
  group: verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test .github/scripts/pr-policy.test.mjs
      - run: node .github/scripts/check-pr.mjs
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node .github/scripts/check-docs.mjs
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_pgsql, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: php vendor/bin/pint --test
      - run: php artisan test
